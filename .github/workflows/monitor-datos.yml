name: Actualizar datos del dashboard

# Corre el bot que reconstruye pages/monitor/datos_historicos.json y commitea el
# resultado SOLO si hay datos nuevos. Si las fuentes del BCRA no responden, la
# corrida falla (y GitHub avisa por mail) en vez de publicar datos viejos.

on:
  schedule:
    - cron: '0 8 * * *'      # 08:00 UTC = 05:00 AR, todos los días
  workflow_dispatch: {}       # botón para correrlo a mano

permissions:
  contents: write

concurrency:
  group: monitor-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pages/monitor/requirements.txt

      - name: Instalar dependencias
        run: pip install -r pages/monitor/requirements.txt

      - name: Tests del bot (sin red)
        run: python -m unittest discover -s pages/monitor -p 'test_*.py' -v

      - name: Ejecutar el bot
        run: python pages/monitor/bot_monetario.py

      - name: Commit si cambió el JSON
        run: |
          git config user.name  "cer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pages/monitor/datos_historicos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "chore: datos del dashboard actualizados"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
