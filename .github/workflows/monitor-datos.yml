name: Actualizar datos del dashboard

# Corre el bot que reconstruye pages/monitor/datos_historicos.json
# y commitea el resultado si cambió.

on:
  schedule:
    - cron: '0 8 * * *'      # 08:00 UTC = 05:00 AR, todos los días
  workflow_dispatch: {}       # botón para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --upgrade pip pandas requests openpyxl

      - name: Ejecutar el bot
        env:
          ARGENSTATS_API_KEY: ${{ secrets.ARGENSTATS_API_KEY }}   # opcional
        run: python pages/monitor/bot_monetario.py

      - name: Commit si cambió el JSON
        run: |
          git config user.name  "cer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pages/monitor/datos_historicos.json
          git diff --cached --quiet || git commit -m "chore: datos del dashboard actualizados"
          git push
